[package]
name = "ai-gateway-client"
version = "0.1.0"
edition = "2024"
description = "AI Gateway local desktop client"

[lib]
name = "ai_gateway_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai-gateway-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codex-adapter = { path = "../codex-adapter" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
server = { path = "../server" }
tauri = { version = "2", features = [] }
