[package]
name = "ai-gateway-desktop"
version = "0.1.0"
edition = "2024"
description = "AI Gateway desktop application"

[lib]
name = "ai_gateway_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai-gateway-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
codex-adapter = { path = "codex-adapter" }
serde_json = "1"
gateway = { path = "../gateway" }
tauri = { version = "2", features = [] }
